name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --lib --test acvp --test oracle --test campaign --test sdk --test turbo --test wycheproof
      - run: cargo test --doc

  sbpf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-build-sbf --version 4.2.0
      - run: cargo test --test sbpf -- --nocapture --test-threads=1
      # A frame over 4 KiB is only a build warning, and Mollusk runs without
      # the stack gaps that turn it into an access violation on a validator,
      # so fail on the warning, for v0 (fixed frames) as well as v3.
      - name: build-sbf (v0 and v3, no frame overflow)
        run: |
          cargo build-sbf --manifest-path program/Cargo.toml 2>&1 | tee build-v0.log
          ! grep -q 'overflows the maximum allowed frame space' build-v0.log
          cargo build-sbf --arch v3 --manifest-path program/Cargo.toml 2>&1 | tee build-v3.log
          ! grep -q 'overflows the maximum allowed frame space' build-v3.log
      - run: cargo test -p solana-ml-dsa-example --test registration -- --nocapture

  typescript:
    name: bun test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
