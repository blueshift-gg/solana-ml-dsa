[package]
name = "solana-ml-dsa"
version = "0.1.0"
edition = "2024"
description = "ML-DSA-44 (FIPS 204) signature verification for Solana programs."
repository = "https://github.com/blueshift-gg/solana-ml-dsa"
license = "MIT"
keywords = ["ml-dsa", "dilithium", "post-quantum", "solana", "no-std"]
categories = ["cryptography", "no-std"]
readme = "README.md"
exclude = [".github/", ".gitignore", "tests/", "program/"]

[workspace]
members = ["program"]
default-members = ["."]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
solana-shake = { version = "0.1.0", git = "https://github.com/blueshift-gg/solana-shake", rev = "58de1ee9063e3b31eaf187b066d696c5792197ca" }

[dev-dependencies]
fips204 = "0.4"
pqcrypto-mldsa = "0.1"
pqcrypto-traits = "0.3"
rand_core = "0.6"
serde_json = "1"
svm-unit-test = "0.1.10"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
